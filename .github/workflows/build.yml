# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' # Triggers when pushing tags that start with 'v' (e.g., v1.0.0)
  pull_request:
    branches: [ "master" ]

# Grants the GITHUB_TOKEN permission to create releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27.1'

    - name: Build
      run: CGO_ENABLED=0 go build -v -o reading-group ./...

    - name: Test
      run: go test -v ./...

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: reading-group
